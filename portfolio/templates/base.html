{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      {% block title %}
      Hidden Layer
      {% endblock %}
    </title>
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white font-sans">

  <!-- Navbar -->
  <nav class="flex justify-between items-center p-6 bg-gray-800 shadow-lg">
    <div class="flex items-center">
      <img src="{% static 'LOGO.png' %}" alt="Logo" class="h-8 mr-4">
      <h1 class="text-2xl font-bold">HIDDEN LAYER</h1>
    </div>
    <div class="space-x-6">
      <a href="/#notes" class="hover:text-blue-400">Notes</a>
      <a href="/#projects" class="hover:text-blue-400">Projects</a>
      <a href="/#resources" class="hover:text-blue-400">Resources</a>
      <a href="/#contact" class="hover:text-blue-400">Contact</a>
    </div>
  </nav>

  {% block content %}
  
  {% endblock %}

  <!-- Footer -->
  <footer class="text-center p-6 bg-gray-800 mt-10">
    <div class="text-gray-500 flex justify-center items-center gap-3">
      <span>© 2026 Alin Anto</span>
      <span>Visitors: {{ visit_count }}</span>
    </div>
  </footer>

</body>
</html>
