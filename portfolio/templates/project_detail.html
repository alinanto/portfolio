<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ project.title }} | Hidden Layer</title>

  <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .prose h1,
        .prose h2,
        .prose h3,
        .prose h4 {
            color: white;
            margin-top: 2rem;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        .prose p,
        .prose li {
            color: #d1d5db;
            line-height: 1.8;
        }

        .prose a {
            color: #60a5fa;
        }

        .prose pre {
            background: #111827;
            padding: 1rem;
            border-radius: 1rem;
            overflow-x: auto;
            margin: 1.5rem 0;
        }

        .prose code {
            color: #93c5fd;
        }

        .prose table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
        }

        .prose th,
        .prose td {
            border: 1px solid #374151;
            padding: 0.75rem;
        }

        .prose img {
            border-radius: 1rem;
            margin: 2rem auto;
        }
    </style>

  <!-- Highlight.js -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <script>
    hljs.highlightAll();
  </script>
</head>

{% load static %}

<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="flex justify-between items-center p-6 bg-gray-800 shadow-lg">
    <div class="flex items-center">
      <img src="{% static 'LOGO.png' %}" alt="Logo" class="h-8 mr-4">
      <a href="/" class="text-2xl font-bold">HIDDEN LAYER</a>
    </div>
  </nav>

  <!-- Content -->
  <main class="flex-1 max-w-5xl mx-auto px-6 py-14 w-full">

    <div class="mb-10">
      <h1 class="text-5xl font-bold mb-4">
        {{ project.title }}
      </h1>

      <p class="text-gray-400 text-lg mb-6">
        {{ project.short_description }}
      </p>

      <div class="flex flex-wrap gap-2 mb-8">
        {% for tag in project.tag_list %}
        <span class="bg-gray-800 text-blue-300 px-3 py-1 rounded-full text-sm border border-gray-700">
          {{ tag }}
        </span>
        {% endfor %}
      </div>

      {% if project.github_link %}
      <a href="{{ project.github_link }}"
         target="_blank"
         class="inline-block bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-xl transition">
        View on GitHub
      </a>
      {% endif %}
    </div>

    <!-- Markdown Content -->
    <article class="prose prose-invert prose-lg max-w-none">
      {{ rendered_markdown|safe }}
    </article>

  </main>

  <!-- Footer -->
  <footer class="text-center p-6 bg-gray-800 mt-10">
    <div class="text-gray-500">
      © 2026 Alin Anto
    </div>
  </footer>

</body>
</html>
